; PlatformIO Project Configuration File
;
; ESPpio firmware: bridges line-based serial commands from the BrachioGraph
; Python shim (esppio.py) to hardware-PWM servo outputs (LEDC) on the ESP32-S3.
;
; Build & upload:
;   pio run -t upload
;   pio device monitor -b 921600

[platformio]
default_envs = esp32-s3-mini

[env:esp32-s3-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600

; LOLIN S3 Mini has 4 MB flash; the devkitc-1 board defaults to 8 MB.
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; Native USB-CDC: appears as /dev/ttyACM* on Linux and /dev/cu.usbmodem* on macOS,
; no driver required.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
